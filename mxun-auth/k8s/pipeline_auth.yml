apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: test-mxun
  name: mxun-auth
  labels:
    app: mxun-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mxun-auth
  template:
    metadata:
      labels:
        app: mxun-auth
    spec:
      containers:
      - name: mxun-auth
        image: 192.168.50.131:80/repo/test_mxun/mxun-auth:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 7001
---
apiVersion: v1
kind: Service
metadata:
  namespace: test-mxun
  labels:
    app: mxun-auth
  name: mxun-auth
spec:
  selector:
    app: mxun-auth
  ports:
  - port: 8081
    targetPort: 7001
    nodePort: 30001
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: test-mxun
  name: mxun-auth
spec:
  ingressClassName: ingress
  rules:
  - host: auth.mxun.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mxun-auth
            port:
              number: 8081